name: Pre-merge quality

on:
  pull_request:
  push:
    branches: [trunk, 'poc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  checks:
    name: Format, vet, tests, race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.27.4'
      - name: Linux Wails build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Formatting and whitespace
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
          git diff --check
          git diff --check HEAD^ HEAD
      - run: go mod verify
      - run: go vet ./...
      - name: Deterministic tests and package coverage (no infrastructure)
        run: go test -count=1 -v -coverprofile=coverage.out ./... | tee tests.log
      - name: Race detection (Linux amd64 with CGO)
        run: go test -race -count=1 ./...
      - name: Coverage detail
        run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: test-and-coverage
          path: |
            coverage.out
            tests.log
  windows:
    name: Windows desktop and tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.27.4'
      - run: go test -count=1 ./...
      - run: go build -trimpath -o bin/viii.exe ./cmd/desktop
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-desktop
          path: bin/viii.exe
  wasi:
    name: WASI worker compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.27.4'
      - run: go build -trimpath -o bin/worker.wasm ./cmd/worker
        env:
          GOOS: wasip1
          GOARCH: wasm
          CGO_ENABLED: '0'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.14.0'
      - run: go build -trimpath -o bin/worker-native ./cmd/worker
      - name: Native and preview1 WASI normalization contract
        run: node scripts/verify-worker.cjs
      - name: Desktop evidence state and message controls
        run: node scripts/verify-desktop.cjs
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wasi-worker
          path: bin/worker.wasm
  pdf-chunker:
    name: PDF chunker worker (flpdf, WASI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WASMTIME_VERSION: v51.0.0
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent PDF tools (qpdf, Poppler)
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Tests and 128 MiB pre-sized wasm32-wasip1 build (ADR-0003)
        working-directory: workers/pdf-chunker
        run: |
          rustup target add wasm32-wasip1
          cargo test --release --locked
          RUSTFLAGS="-C link-arg=--initial-memory=134217728" \
            cargo build --release --locked --target wasm32-wasip1 --target-dir target-initmem
          cp target-initmem/wasm32-wasip1/release/viii-pdf-chunker.wasm ../../pdf-chunker.wasm
          sha256sum ../../pdf-chunker.wasm
      - name: Batch mode under Wasmtime (WASI Preview 1) with self-contained sidecars
        run: |
          curl -fsSL -o wt.tar.xz "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar xf wt.tar.xz
          export PATH="$PWD/wasmtime-${WASMTIME_VERSION}-x86_64-linux:$PATH"
          mkdir -p /tmp/in /tmp/out /tmp/ctl && touch /tmp/ctl/accepted
          (cd experiments/pdf-chunker && python -c "import test_bench as t; t.tiny_pdf('/tmp/in/original.pdf', 9)")
          sha=$(sha256sum /tmp/in/original.pdf | cut -d' ' -f1)
          wasmtime run --dir /tmp/in::/in --dir /tmp/out::/out --dir /tmp/ctl::/ctl pdf-chunker.wasm \
            /in/original.pdf --chunk-size 4 --out-dir /out --ack /ctl/accepted --source-sha256 "$sha"
          test "$(cat /tmp/out/ready)" = ready
          python - "$sha" <<'PY'
          import json, subprocess, sys
          sha = sys.argv[1]
          for first, last in [(1, 4), (5, 8), (9, 9)]:
              name = f"/tmp/out/chunk-{first:06d}-{last:06d}"
              s = json.load(open(name + ".json"))
              assert s["schema"] == "viii.pdf-chunk-sidecar.v1" and s["extract_route"] == "lean", s
              assert s["source_page_count"] == 9 and s["source_sha256_declared"] == sha and s["chunk_size"] == 4, s
              assert s["pages"] == [{"local": n - first + 1, "physical": n} for n in range(first, last + 1)], s
              subprocess.run(["qpdf", "--check", name + ".pdf"], check=True, capture_output=True)
              subprocess.run([sys.executable, "experiments/pdf-chunker/validate.py", "--original", "/tmp/in/original.pdf",
                              "--derived", name + ".pdf", "--first", str(first), "--last", str(last)], check=True)
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pdf-chunker-wasi
          path: pdf-chunker.wasm
